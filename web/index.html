<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>processGPX</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Upload screen -->
    <div id="uploadScreen" class="upload-screen">
        <div class="upload-content">
            <h1>processGPX</h1>
            <div id="dropZone" class="file-upload-area">
                <input type="file" id="gpxFile" accept=".gpx" style="display: none;" />
                <label for="gpxFile" class="file-upload-button">
                    <span id="dropLabel">Drag &amp; drop a GPX file here, or click to browse</span>
                    <span class="file-types">Only .gpx accepted (max 5 MB)</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Results screen -->
    <div id="resultsScreen" class="results-screen hidden">
        <div class="main-container">
            <div class="left-panel">
                <div id="map"></div>
                <div id="optionsPanel" class="options-panel hidden">
                    <div class="options-header">
                        <h2>Options</h2>
                        <span class="options-count" id="optionsCount">0 selected</span>
                    </div>
                    <div class="options-grid" id="optionsGrid"></div>
                </div>
            </div>
            <div class="right-sidebar">
                <div class="sidebar-content">
                    <h2 id="trackName" class="track-name"></h2>

                    <div class="legend">
                        <div class="legend-item toggleable" id="toggleOriginal" title="Click to toggle visibility">
                            <span class="legend-line original"></span>
                            <span>Original</span>
                            <span class="legend-eye" id="eyeOriginal">&#x25C9;</span>
                        </div>
                        <div class="legend-item toggleable" id="toggleProcessed" title="Click to toggle visibility">
                            <span class="legend-line processed"></span>
                            <span>Processed</span>
                            <span class="legend-eye" id="eyeProcessed">&#x25C9;</span>
                        </div>
                    </div>

                    <div id="statsPanel" class="stats-panel hidden">
                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Original</th>
                                    <th>Processed</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Points</td>
                                    <td id="origPoints">-</td>
                                    <td id="procPoints">-</td>
                                </tr>
                                <tr>
                                    <td>Distance</td>
                                    <td id="origDist">-</td>
                                    <td id="procDist">-</td>
                                </tr>
                                <tr>
                                    <td>Elev</td>
                                    <td id="origElev">-</td>
                                    <td id="procElev">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <button id="processGpxBtn" class="process-button primary-button">processGPX</button>
                    <button id="downloadBtn" class="process-button disabled" disabled>Download processed GPX</button>
                    <button id="optionsBtn" class="process-button options-button">Options</button>
                    <button id="resetBtn" class="process-button reset-button">Load another file</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingMessage">Processing...</p>
        </div>
    </div>

    <!-- Error overlay -->
    <div id="error" class="error-overlay hidden">
        <div class="error-content">
            <h3>Error</h3>
            <p id="errorMessage"></p>
            <button id="errorBackBtn">Back</button>
        </div>
    </div>

    <div class="version-footer" id="versionFooter"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
    <script>
        const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5 MiB

        let map = null;
        let originalLayer = null;
        let processedLayer = null;
        let startMarkers = [];
        let endMarkers = [];
        let currentFileName = '';
        let processedGpxBlob = null;
        let originalVisible = true;
        let processedVisible = true;
        let optionsVisible = false;

        // Option definitions: { name, type: 'boolean' | 'value', hint }
        const OPTIONS = [

            { name: 'arcInterpolationDegs', type: 'value', hint: 'degrees' },

            { name: 'autoSmoothG', type: 'value', hint: 'scale' },
            { name: 'autoSmoothZ', type: 'value', hint: 'scale' },

            { name: 'autoSplits', type: 'value', hint: 'count' },

            { name: 'autoStraightenLength', type: 'value', hint: 'meters' },
            { name: 'author', type: 'value', hint: 'string' },

            { name: 'circleStart', type: 'value', hint: 'meters ...' },

            { name: 'circuitFromPosition', type: 'value', hint: 'meters circuits [repeats]' },
            { name: 'circuitToPosition', type: 'value', hint: 'meters circuits [repeats]' },
            { name: 'closeLoop', type: 'boolean' },

            { name: 'cornerCrop', type: 'value', hint: 'meters' },
            { name: 'cornerCropArcFit', type: 'boolean' },
            { name: 'cornerCropStart', type: 'value', hint: 'meters' },
            { name: 'cornerCropEnd', type: 'value', hint: 'meters' },
            { name: 'cornerEffect', type: 'value', hint: 'number' },
            { name: 'cropMax', type: 'value', hint: 'meters' },

            { name: 'crossingAngle', type: 'value', hint: 'degrees' },
            { name: 'crossingHeight', type: 'value', hint: 'meters' },
            { name: 'crossingTransition', type: 'value', hint: 'meters' },
            { name: 'curvatureSmoothing', type: 'value', hint: 'meters' },

            { name: 'extend', type: 'value', hint: 'meters' },
            { name: 'extendBack', type: 'value', hint: 'meters' },
            { name: 'finishCircuitDistance', type: 'value', hint: 'meters' },

            { name: 'fitArcsDMax', type: 'value', hint: 'meters' },
            { name: 'fitArcsStart', type: 'value', hint: 'meters' },
            { name: 'fitArcsEnd', type: 'value', hint: 'meters' },
            { name: 'fitArcsUniformGradient', type: 'boolean' },
            { name: 'fixCrossings', type: 'boolean' },
            { name: 'fixSteps', type: 'boolean' },
            { name: 'flatten', type: 'value', hint: 'start alt end [alt] [trans] [bow] ...' },
            { name: 'gradientPower', type: 'value', hint: 'number' },

            { name: 'keywords', type: 'value', hint: 'word,word,...' },
            { name: 'laneShift', type: 'value', hint: 'meters' },
            { name: 'loop', type: 'boolean' },
            { name: 'loopLeft', type: 'boolean' },
            { name: 'loopRight', type: 'boolean' },
            { name: 'maxCornerCropDegs', type: 'value', hint: 'degrees' },
            { name: 'maxSlope', type: 'value', hint: '%' },
            { name: 'minCornerCropDegs', type: 'value', hint: 'degrees' },
            { name: 'minRadius', type: 'value', hint: 'meters' },
            { name: 'minRadiusStart', type: 'value', hint: 'meters' },
            { name: 'minRadiusEnd', type: 'value', hint: 'meters' },
            { name: 'name', type: 'value', hint: 'string' },
            { name: 'outAndBack', type: 'boolean' },
            { name: 'outAndBackLap', type: 'boolean' },

            { name: 'prune', type: 'boolean' },
            { name: 'pruneD', type: 'value', hint: 'meters' },

            { name: 'prunedg', type: 'value', hint: 'value' },
            { name: 'rCrossings', type: 'value', hint: 'meters' },
            { name: 'rLap', type: 'value', hint: 'meters' },
            { name: 'rTurnaround', type: 'value', hint: 'meters' },
            { name: 'rUTurn', type: 'value', hint: 'meters' },
            { name: 'RGT2BT', type: 'boolean' },
            { name: 'repeat', type: 'value', hint: 'count' },

            { name: 'reverse', type: 'boolean' },
            { name: 'segment', type: 'value', hint: 'start,end,name;...' },
            { name: 'selectiveLaneShift', type: 'value', hint: 'shift pos shift ...' },
            { name: 'selectiveSmooth', type: 'value', hint: 'sigma pos sigma ...' },
            { name: 'selectiveSmoothG', type: 'value', hint: 'sigma pos sigma ...' },

            { name: 'simplifyD', type: 'value', hint: 'meters' },
            { name: 'simplifyPoints', type: 'boolean' },
            { name: 'simplifyZ', type: 'value', hint: 'meters' },
            { name: 'smooth', type: 'value', hint: 'meters' },
            { name: 'smoothAngle', type: 'value', hint: 'degrees' },
            { name: 'smoothG', type: 'value', hint: 'meters' },
            { name: 'smoothStart', type: 'value', hint: 'meters' },
            { name: 'smoothEnd', type: 'value', hint: 'meters' },
            { name: 'smoothZ', type: 'value', hint: 'meters' },
            { name: 'snap', type: 'value', hint: '1 or 2' },
            { name: 'snapAltitude', type: 'value', hint: 'meters' },
            { name: 'snapDistance', type: 'value', hint: 'meters' },
            { name: 'snapTransition', type: 'value', hint: 'meters' },
            { name: 'spacing', type: 'value', hint: 'meters' },
            { name: 'splineDegs', type: 'value', hint: 'degrees' },
            { name: 'splineInterpolation', type: 'boolean' },
            { name: 'splineMaxDegs', type: 'value', hint: 'degrees' },
            { name: 'splineMaxRatio', type: 'value', hint: 'ratio' },
            { name: 'splineStart', type: 'value', hint: 'meters' },
            { name: 'splineEnd', type: 'value', hint: 'meters' },
            { name: 'splitAt', type: 'value', hint: 'meters ...' },
            { name: 'splitNumber', type: 'value', hint: 'number' },
            { name: 'startCircuitDistance', type: 'value', hint: 'meters' },
            { name: 'startCircuits', type: 'value', hint: 'count' },
            { name: 'startTime', type: 'value', hint: 'time string' },
            { name: 'straight', type: 'value', hint: 'start end ...' },
            { name: 'straightStart', type: 'value', hint: 'meters ...' },
            { name: 'straightEnd', type: 'value', hint: 'meters ...' },
            { name: 'stripSegments', type: 'boolean' },
            { name: 'timeSplits', type: 'value', hint: 'count' },
            { name: 'track', type: 'value', hint: 'number' },
            { name: 'uniformGradient', type: 'value', hint: 'start end [bow] ...' },
            { name: 'xShift', type: 'value', hint: 'meters' },
            { name: 'yShift', type: 'value', hint: 'meters' },
            { name: 'zOffset', type: 'value', hint: 'meters' },
            { name: 'zScale', type: 'value', hint: 'factor' },
            { name: 'zScaleRef', type: 'value', hint: 'meters' },
            { name: 'zShift', type: 'value', hint: 'meters' },
            { name: 'zShiftStart', type: 'value', hint: 'meters' },
            { name: 'zShiftEnd', type: 'value', hint: 'meters' },
        ];

        // --- UI helpers ---
        function show(id) { document.getElementById(id).classList.remove('hidden'); }
        function hide(id) { document.getElementById(id).classList.add('hidden'); }

        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            show('error');
            hide('loading');
        }

        function showLoading(msg) {
            document.getElementById('loadingMessage').textContent = msg || 'Processing...';
            show('loading');
        }

        // --- Map ---
        function initMap() {
            if (map) { map.remove(); map = null; }
            map = L.map('map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }

        function createEndpointMarker(latlng, color, label) {
            return L.circleMarker(latlng, {
                radius: 7,
                fillColor: color,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).bindTooltip(label, { permanent: false, direction: 'top' });
        }

        function getTrackCoords(gpxText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(gpxText, 'text/xml');
            const geojson = toGeoJSON.gpx(doc);
            // Find first LineString or MultiLineString
            for (const f of geojson.features) {
                if (f.geometry.type === 'LineString') {
                    return f.geometry.coordinates;
                }
                if (f.geometry.type === 'MultiLineString') {
                    return f.geometry.coordinates.flat();
                }
            }
            return [];
        }

        function computeStats(coords) {
            let distance = 0;
            let elevGain = 0;
            for (let i = 1; i < coords.length; i++) {
                const [lon1, lat1, ele1] = coords[i - 1];
                const [lon2, lat2, ele2] = coords[i];
                // Haversine
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) ** 2 +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) ** 2;
                distance += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                if (ele2 !== undefined && ele1 !== undefined) {
                    const dEle = ele2 - ele1;
                    if (dEle > 0) elevGain += dEle;
                }
            }
            return { points: coords.length, distance, elevGain };
        }

        function formatDist(meters) {
            return (meters / 1000).toFixed(2) + ' km';
        }

        function formatElev(meters) {
            return Math.round(meters) + ' m';
        }

        function displayGpxOnMap(gpxText, color, isProcessed) {
            const parser = new DOMParser();
            const gpxDoc = parser.parseFromString(gpxText, 'text/xml');
            const geojson = toGeoJSON.gpx(gpxDoc);

            const layer = L.geoJSON(geojson, {
                style: { color: color, weight: isProcessed ? 4 : 3, opacity: isProcessed ? 0.9 : 0.6 }
            }).addTo(map);

            return layer;
        }

        // Add start/end markers for a track (call after map has a view)
        function addEndpointMarkers(gpxText, isProcessed) {
            const coords = getTrackCoords(gpxText);
            if (coords.length < 2) {
                startMarkers.push(null);
                endMarkers.push(null);
                return;
            }
            const startLL = [coords[0][1], coords[0][0]];
            const endLL = [coords[coords.length - 1][1], coords[coords.length - 1][0]];
            const tag = isProcessed ? 'Processed' : 'Original';

            // Check if loop (start and end within 10m)
            const dist = map.distance(startLL, endLL);
            if (dist <= 10) {
                const startM = createEndpointMarker(startLL, '#2ecc71', tag + ' start/finish').addTo(map);
                startMarkers.push(startM);
                endMarkers.push(null);
            } else {
                const startM = createEndpointMarker(startLL, '#2ecc71', tag + ' start').addTo(map);
                const endM = createEndpointMarker(endLL, '#e74c3c', tag + ' end').addTo(map);
                startMarkers.push(startM);
                endMarkers.push(endM);
            }
        }

        // --- Toggle track visibility ---
        function toggleOriginal() {
            if (!originalLayer) return;
            originalVisible = !originalVisible;
            if (originalVisible) {
                map.addLayer(originalLayer);
                startMarkers[0] && map.addLayer(startMarkers[0]);
                endMarkers[0] && map.addLayer(endMarkers[0]);
            } else {
                map.removeLayer(originalLayer);
                startMarkers[0] && map.removeLayer(startMarkers[0]);
                endMarkers[0] && map.removeLayer(endMarkers[0]);
            }
            document.getElementById('eyeOriginal').style.opacity = originalVisible ? 1 : 0.3;
        }

        function toggleProcessed() {
            if (!processedLayer) return;
            processedVisible = !processedVisible;
            if (processedVisible) {
                map.addLayer(processedLayer);
                startMarkers[1] && map.addLayer(startMarkers[1]);
                endMarkers[1] && map.addLayer(endMarkers[1]);
            } else {
                map.removeLayer(processedLayer);
                startMarkers[1] && map.removeLayer(startMarkers[1]);
                endMarkers[1] && map.removeLayer(endMarkers[1]);
            }
            document.getElementById('eyeProcessed').style.opacity = processedVisible ? 1 : 0.3;
        }

        // --- Options panel ---
        const DEFAULT_OPTIONS = new Set(['auto', 'simplifyPoints', 'fitArcs', 'arcInterpolation']);

        function buildOptionsGrid() {
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            OPTIONS.forEach(opt => {
                const item = document.createElement('div');
                item.className = 'option-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'opt_' + opt.name;
                checkbox.className = 'option-checkbox';
                if (DEFAULT_OPTIONS.has(opt.name)) checkbox.checked = true;
                checkbox.addEventListener('change', updateOptionsCount);

                const label = document.createElement('label');
                label.htmlFor = 'opt_' + opt.name;
                label.className = 'option-label';
                label.textContent = opt.name;

                item.appendChild(checkbox);
                item.appendChild(label);

                if (opt.type === 'value') {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = 'optval_' + opt.name;
                    input.className = 'option-value';
                    input.placeholder = opt.hint || '';
                    input.addEventListener('input', () => {
                        if (input.value.trim()) {
                            checkbox.checked = true;
                        }
                        updateOptionsCount();
                    });
                    item.appendChild(input);
                }

                grid.appendChild(item);
            });
            updateOptionsCount();
        }

        function updateOptionsCount() {
            const count = document.querySelectorAll('.option-checkbox:checked').length;
            document.getElementById('optionsCount').textContent = count + ' selected';
        }

        function getSelectedOptions() {
            const args = [];
            OPTIONS.forEach(opt => {
                const cb = document.getElementById('opt_' + opt.name);
                if (!cb || !cb.checked) return;
                if (opt.type === 'boolean') {
                    args.push('-' + opt.name);
                } else {
                    const val = document.getElementById('optval_' + opt.name);
                    const v = val ? val.value.trim() : '';
                    if (v) {
                        args.push('-' + opt.name);
                        args.push(v);
                    } else {
                        args.push('-' + opt.name);
                    }
                }
            });
            return args;
        }

        function toggleOptions() {
            optionsVisible = !optionsVisible;
            const mapEl = document.getElementById('map');
            const optPanel = document.getElementById('optionsPanel');
            const btn = document.getElementById('optionsBtn');
            if (optionsVisible) {
                mapEl.classList.add('hidden');
                optPanel.classList.remove('hidden');
                btn.classList.add('active');
                btn.textContent = 'Map';
            } else {
                optPanel.classList.add('hidden');
                mapEl.classList.remove('hidden');
                btn.classList.remove('active');
                btn.textContent = 'Options';
                if (map) { map.invalidateSize(); }
            }
        }

        // --- File handling ---
        function handleFile(file) {
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.gpx')) {
                showError('Please select a .gpx file.');
                return;
            }
            if (file.size > MAX_FILE_SIZE) {
                showError('File exceeds the 5 MB limit.');
                return;
            }

            currentFileName = file.name;

            // Update drop zone label to show selected filename
            document.getElementById('dropLabel').textContent = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                const gpxText = e.target.result;
                showResults(gpxText);
            };
            reader.onerror = function() { showError('Failed to read file.'); };
            reader.readAsText(file);
        }

        function showResults(gpxText) {
            hide('uploadScreen');
            show('resultsScreen');

            // Extract track name from GPX
            const parser = new DOMParser();
            const doc = parser.parseFromString(gpxText, 'text/xml');
            const nameEl = doc.querySelector('trk > name') || doc.querySelector('metadata > name');
            document.getElementById('trackName').textContent =
                (nameEl ? nameEl.textContent : currentFileName.replace(/\.gpx$/i, ''));

            initMap();
            startMarkers = [];
            endMarkers = [];
            originalLayer = displayGpxOnMap(gpxText, '#3498db', false);
            originalVisible = true;
            document.getElementById('eyeOriginal').style.opacity = 1;
            map.fitBounds(originalLayer.getBounds(), { padding: [30, 30] });
            addEndpointMarkers(gpxText, false);

            // Compute and show original stats
            const origCoords = getTrackCoords(gpxText);
            const origStats = computeStats(origCoords);
            document.getElementById('origPoints').textContent = origStats.points;
            document.getElementById('origDist').textContent = formatDist(origStats.distance);
            document.getElementById('origElev').textContent = formatElev(origStats.elevGain);
            document.getElementById('procPoints').textContent = '-';
            document.getElementById('procDist').textContent = '-';
            document.getElementById('procElev').textContent = '-';
            show('statsPanel');

            // Reset processed state
            processedGpxBlob = null;
            processedLayer = null;
            processedVisible = true;
            document.getElementById('eyeProcessed').style.opacity = 0.3;
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.disabled = true;
            dlBtn.classList.add('disabled');
        }

        // --- Process GPX via server ---
        async function processGPX() {
            const fileInput = document.getElementById('gpxFile');
            const file = fileInput.files[0];
            if (!file) { showError('No file loaded.'); return; }

            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            showLoading(`Processing ${file.name} (${sizeMB} MB)...`);

            const formData = new FormData();
            formData.append('gpx', file);
            const selectedOpts = getSelectedOptions();
            if (selectedOpts.length > 0) {
                formData.append('options', JSON.stringify(selectedOpts));
            }

            try {
                const resp = await fetch('/process', { method: 'POST', body: formData });
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(text || `Server error: ${resp.status}`);
                }

                const result = await resp.json();
                const processedGpxText = result.gpx;
                processedGpxBlob = new Blob([processedGpxText], { type: 'application/gpx+xml' });

                // Display processed route
                if (processedLayer) { map.removeLayer(processedLayer); }
                processedLayer = displayGpxOnMap(processedGpxText, '#e74c3c', true);
                addEndpointMarkers(processedGpxText, true);
                processedVisible = true;
                document.getElementById('eyeProcessed').style.opacity = 1;

                // Compute and show processed stats
                const procCoords = getTrackCoords(processedGpxText);
                const procStats = computeStats(procCoords);
                document.getElementById('procPoints').textContent = procStats.points;
                document.getElementById('procDist').textContent = formatDist(procStats.distance);
                document.getElementById('procElev').textContent = formatElev(procStats.elevGain);

                // Enable download
                const dlBtn = document.getElementById('downloadBtn');
                dlBtn.disabled = false;
                dlBtn.classList.remove('disabled');

                hide('loading');
            } catch (err) {
                showError(err.message);
            }
        }

        function downloadProcessed() {
            if (!processedGpxBlob) return;
            const baseName = currentFileName.replace(/\.gpx$/i, '');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(processedGpxBlob);
            a.download = `${baseName}_processed.gpx`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function resetApp() {
            hide('resultsScreen');
            hide('statsPanel');
            show('uploadScreen');
            document.getElementById('gpxFile').value = '';
            document.getElementById('dropLabel').textContent =
                'Drag & drop a GPX file here, or click to browse';
            currentFileName = '';
            processedGpxBlob = null;
            if (map) { map.remove(); map = null; }
            originalLayer = null;
            processedLayer = null;
            startMarkers = [];
            endMarkers = [];
            originalVisible = true;
            processedVisible = true;
            // Reset options view if active
            if (optionsVisible) {
                optionsVisible = false;
                document.getElementById('map').classList.remove('hidden');
                document.getElementById('optionsPanel').classList.add('hidden');
                document.getElementById('optionsBtn').classList.remove('active');
                document.getElementById('optionsBtn').textContent = 'Options';
            }
        }

        // --- Event listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('gpxFile');
            const dropZone = document.getElementById('dropZone');

            fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

            // Drag and drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                const dt = new DataTransfer();
                dt.items.add(file);
                fileInput.files = dt.files;
                handleFile(file);
            });

            buildOptionsGrid();
            document.getElementById('optionsBtn').addEventListener('click', toggleOptions);
            document.getElementById('processGpxBtn').addEventListener('click', processGPX);
            document.getElementById('downloadBtn').addEventListener('click', downloadProcessed);
            document.getElementById('resetBtn').addEventListener('click', resetApp);
            document.getElementById('toggleOriginal').addEventListener('click', toggleOriginal);
            document.getElementById('toggleProcessed').addEventListener('click', toggleProcessed);
            document.getElementById('errorBackBtn').addEventListener('click', () => {
                hide('error');
            });

            // Fetch version
            fetch('/version').then(r => r.text()).then(v => {
                document.getElementById('versionFooter').textContent = 'processGPX v' + v;
            }).catch(() => {});
        });
    </script>
</body>

</html>
